"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
scan_timeout = 1000
command_timeout = 1000

format = """
[](color_orange)\
$os\
$username\
[](fg:color_orange bg:color_yellow)\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$time\
[](fg:color_bg1) \
$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = '[$symbol ]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[$user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[](fg:color_yellow bg:color_aqua)[ $symbol $branch ](fg:color_fg0 bg:color_aqua)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[c]
symbol = "󰙲 "
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[bun]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[](fg:color_aqua bg:color_blue)[ $symbol($version) ](fg:color_fg0 bg:color_blue)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[](fg:color_blue bg:color_bg3)[ $symbol($context) ](fg:#83a598 bg:color_bg3)'

[conda]
symbol = " "
style = "bg:color_bg3"
format = '[](fg:color_blue bg:color_bg3)[ $symbol($environment) ](fg:#83a598 bg:color_bg3)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[](fg:color_bg3 bg:color_bg1)[  $time ](fg:color_fg0 bg:color_bg1)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
